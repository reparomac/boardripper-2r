    <script>/* 31/10/2026 (Roger): leituras do multímetro sem os cards azuis; captura automática só quando a leitura fica
       firme por 2 s (antes 1 s). Uma vez só: quem tinha o padrão de 1 s passa para 2 s; a escolha da tela continua valendo. */
    /* 31/10/2026 09h12 (Roger: «os dois multímetros ficam oscilando o tempo todo, isso não é uma medição… só levar em
       conta quando estabilizar a leitura»): a leitura só vale quando TODA a janela (o tempo da captura, 2 s) ficou
       dentro de uma faixa estreita — diodo 2 mV; tensão 2 mV ou 0,3 %; resistência 0,5 Ω ou 0,5 % — com pelo menos 5
       leituras. Ponta solta/flutuando oscila mais que isso e não grava. Depois de gravar, só volta a gravar quando a
       ponta sai (OL) ou a leitura muda de verdade (50 mV / 20 %; resistência 5 Ω / 20 %) e firma de novo. */
    window.__2rEstavel = function (s, v, t, modo, hold) {
      var av = Math.abs(v), tol = modo === 'diodo' ? 0.002 : modo === 'resistencia' ? Math.max(0.5, av * 0.005) : Math.max(0.002, av * 0.003);
      if (!s.armed && s.lastCaptured != null) {
        var lc = Math.abs(s.lastCaptured), mud = modo === 'resistencia' ? Math.max(5, lc * 0.2) : Math.max(0.05, lc * 0.2);
        if (Math.abs(v - s.lastCaptured) > mud) s.armed = true;
      }
      var r = s.run;
      if (!r || Math.max(r.max, v) - Math.min(r.min, v) > tol) {
        s.run = { ini: t, min: v, max: v, n: 1 };
        return { reinicio: true };
      }
      r.min = Math.min(r.min, v); r.max = Math.max(r.max, v); r.n++;
      var idade = t - r.ini;
      return { bip: r.n >= 4 && idade >= Math.min(1000, hold / 2), pronto: r.n >= 5 && idade >= hold, valor: v };
    };
    /* 31/10/2026 09h14 (Roger: «diminuir 50% sem efeito neon»): linha da net com metade da espessura (×0,575 → ×0,2875)
       e sem o brilho neon em volta dela */
    window.__r2NetLineK = 0.2875; window.__r2NeonK = 0;

    } catch (e) {} })();</script>

<script>/* Valores do ponto a ponto no padrão do SDS (Roger, 26/10/2026: «pode ser com vírgula ou ponto, acho bom
   travar no padrão do SDS»): aceita 3,3 · 3.3 · 3,3V · 10k · 1,2M · 100R · OL e grava como o multímetro grava

window.__r2Num = function (k, s) {
  /* 26/10/2026 18h (Roger: «o padrão é com vírgula, e vamos manter a tensão com duas casas decimais e sempre add o V»):
     tensão «3,30 V» · diodo «0,512» · resistência «10,00k» / «1,20M» / «100,0» */
  s = String(s == null ? '' : s).trim(); if (!s) return '';
  var u = s.toUpperCase().replace(/\s+/g, '').replace(/Ω/g, '');
  if (u === 'OL' || u === 'O.L' || u === 'O.L.') return 'OL';
  u = u.replace(/(OHMS|OHM|VOLTS|VOLT|V|R)$/, '');
  var m = /^([-+]?\d+(?:[.,]\d+)?)([KM])?$/.exec(u); if (!m) return null;
  var n = parseFloat(m[1].replace(',', '.')); if (m[2] === 'K') n *= 1e3; if (m[2] === 'M') n *= 1e6;
  var c = function (x) { return x.replace('.', ','); };
  if (k === 'r' || k === 'ir') { var a = Math.abs(n); return c(a >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (n / 1e3).toFixed(2) + 'k' : n.toFixed(1)); }
  if (k === 'd' || k === 'id') return c(n.toFixed(3));
  return c(n.toFixed(2)) + ' V';
};
/* número de um valor gravado (aceita vírgula, unidade, k/M) */
window.__r2V = function (s) {
  var m = /([-+]?\d+(?:[.,]\d+)?)\s*([kKmM])?/.exec(String(s || '')); if (!m) return null;
  var n = parseFloat(m[1].replace(',', '.')); if (m[2] === 'k' || m[2] === 'K') n *= 1e3; if (m[2] === 'M') n *= 1e6; return n;
};
/* unidade só se ainda não tem */
window.__r2U = function (v, u) { var s = String(v == null ? '' : v); return /(V|Ω)\s*$/.test(s) ? s : s + ' ' + u; };

    <!-- Boot gate. A classic script runs on every engine; the module bundle
         below fails to PARSE on a browser older than the build target
         (Safari < 16.4 chokes on a regex lookbehind), so nothing in it can
         ever show a message. This checks the three things that decide
         whether the bundle can start and writes a plain paragraph if one
         is missing. ES5 only: no const/let, arrows or template strings.
         main.tsx reads window.__brUnsupported and does not mount. -->
    <script>
      (function () {
        var missing = [];
        if (typeof structuredClone !== 'function') missing.push('structuredClone');
        if (typeof OffscreenCanvas === 'undefined') missing.push('OffscreenCanvas');
        try { new RegExp('(?<=a)b'); } catch (e) { missing.push('regular expression lookbehind'); }
        if (!missing.length) return;
        window.__brUnsupported = missing;
        var root = document.getElementById('root');
        if (!root) return;
        document.documentElement.style.background = '#08080c';
        root.innerHTML =
          '<div style="max-width:560px;margin:48px auto;padding:0 20px;font:14px/1.55 Verdana,Geneva,sans-serif;color:#e0e0e0">' +
          '<h1 style="font-size:20px;margin:0 0 12px">BoardRipper needs a newer browser</h1>' +
          '<p>This browser is missing: <b>' + missing.join(', ') + '</b>.</p>' +
          '<p>Minimum: Chrome or Edge 111, Firefox 114, Safari 16.4, iOS / iPadOS 16.4 (all from spring 2023). ' +
          'On an iPad or iPhone, updating iOS is the fix &mdash; every browser there uses Safari&rsquo;s engine, Chrome included.</p>' +
          '<p>If you think it should run on this device, tell me the device and OS version: ' +
          '<a style="color:#4a9eff" href="https://discord.gg/BYEkKTMNNY">Discord</a> (@inwerp on the RipperDoc server) or ' +
          '<a style="color:#4a9eff" href="https://github.com/AlexeyInwerp/BoardRipper/issues/new/choose">GitHub</a>.</p>' +
          '</div>';
      })();
    </script>

            var bns = Array.from(S._matchesByBn ? S._matchesByBn.keys() : []).filter(Boolean);
            if (!bns.length) { fim = 'vazio'; toast('OBD: abra uma placa primeiro (número da placa não identificado).'); return; }

            toast(variants ? ('OBD: ' + got + ' de ' + variants + ' variante(s) lidas.') : 'OBD: nenhum dado encontrado para esta placa.');

<script>/* 29/10/2026 (Roger: «add a ficha dentro do estudo, assim podemos fazer as anotações, leituras e gravações dos pontos…

  }

  }

<script>/* 29/10/2026 (Roger: «quando criei o ícone i, de informação, ele gera um código para cada item… é bom ter uma guia pra

      : t === 'CANVAS' ? 'Área de desenho (placa ou PDF)' : t === 'A' ? 'Link' : t === 'TR' || t === 'TH' ? 'Linha de tabela' : 'Área';
  }
  /* nome em português · termo técnico em inglês (29/10/2026: «assim vou aprendendo os termos corretos») */
  function termo(e) {
    var t = e.tagName, ty = (e.getAttribute('type') || '').toLowerCase(), c = ' ' + (typeof e.className === 'string' ? e.className : '') + ' ' + (e.id || '') + ' ';

    if (t === 'INPUT' && ty === 'range') return 'controle deslizante · slider';
